version: "3.9"

services:
  # -----------------------------------------------------------------------
  # FastAPI gateway
  # -----------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_control_plane
    volumes:
      - ./policies:/app/policies:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai_net

  # -----------------------------------------------------------------------
  # PostgreSQL database
  # -----------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_control_plane
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai_net

  # -----------------------------------------------------------------------
  # Ollama (local LLM backend)
  # -----------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ai_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_net

volumes:
  pg_data:
  ollama_data:

networks:
  ai_net:
    driver: bridge
